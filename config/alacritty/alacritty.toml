[general]
live_config_reload = true
working_directory = "None"

[env]
term = "xterm-256color"

[window]
dimensions = { lines = 0, columns = 0 }
position = "None"
padding = { x = 20, y = 20 }
dynamic_padding = false
decorations = "None"
opacity = 0.5
blur = false
startup_mode = "Maximized"
title = "Alacritty"
dynamic_title = false
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"
level = "AlwaysOnTop"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "FiraCode Nerd Font Mono Med", style = "Medium,Regular" }
size = 17
offset = { x = 0, y = 0 }
builtin_box_drawing = false

[colors.primary]
background = "#141B22"
foreground = "#CBD8EA"
dim_foreground = "None"    # It gets automatically calculated
bright_foreground = "None"

[colors]
cursor = { text = "#141B22", cursor = "#8CC6F2" }
selection = { text = "CellForeground", background = "#34506B" }
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

# Glacial ANSI palette — icy blues, with semantic red/green/amber kept usable
# (matches the GTK/icon theme's semantic colors). See docs/glacial-design-language.md.
[colors.normal]
black   = "#1B2530"
red     = "#E58A8A"
green   = "#8FC7B4"
yellow  = "#E7B872"
blue    = "#5E8DB8"
magenta = "#8C9BD8"
cyan    = "#79C0E8"
white   = "#CBD8EA"

[colors.bright]
black   = "#4C5D72"
red     = "#EDA3A3"
green   = "#A6D4B0"
yellow  = "#EBD4A0"
blue    = "#8CC6F2"
magenta = "#B79BD8"
cyan    = "#A6CCEC"
white   = "#E8F0F8"

[bell]
duration = 0
command = "None"

[cursor]
style = { shape = "Beam", blinking = "Never" }
unfocused_hollow = false
thickness = 0.15

[terminal]
shell = "zsh"

[mouse]
hide_when_typing = false
