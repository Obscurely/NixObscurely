[general]
live_config_reload = true
working_directory = "None"

[env]
term = "xterm-256color"

[window]
dimensions = { lines = 0, columns = 0 }
position = "None"
padding = { x = 20, y = 20 }
dynamic_padding = false
decorations = "None"
opacity = 0.6
blur = false
startup_mode = "Maximized"
title = "Alacritty"
dynamic_title = false
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"
level = "AlwaysOnTop"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "FiraMono Nerd Font Mono Medium", style = "Medium,Regular" }
size = 17
offset = { x = 0, y = 0 }
builtin_box_drawing = true

[colors.primary]
background = "#1A1F27"
foreground = "#F0F3F8"
dim_foreground = "None"    # It gets automatically calculated
bright_foreground = "None"

[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

# ANSI palette, cursor AND selection: intentionally the alacritty DEFAULTS, NOT the glacial recolor. The
# terminal is a transparent, all-day working surface where color is functional (ls / git / syntax / errors /
# caret / selection), so legibility and familiarity beat theme purity — the glacial touches read as out of
# place once the rest was restored, so the whole palette is back to default. The cool background is the only
# in-family cue kept. (Omitting [colors.cursor]/[colors.selection]/[colors.normal]/[colors.bright] restores
# alacritty's built-ins.)

[bell]
duration = 0
command = "None"

[cursor]
style = { shape = "Beam", blinking = "Never" }
unfocused_hollow = false
thickness = 0.15

[terminal]
shell = "zsh"

[mouse]
hide_when_typing = false
