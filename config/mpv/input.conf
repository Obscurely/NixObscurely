# ~/.config/mpv/input.conf --- glacial mpv keybinds.
# uosc builds its right-click menu from the menu-annotated lines at the bottom of this file (the text
# after the hash-bang marker on a binding becomes that item's title; ">" nests submenus). IMPORTANT:
# keep prose comments free of that hash-bang marker, or uosc turns the comment itself into a bogus menu
# entry whose "command" fails with "Command 'uosc' not found" when you click it (that was the mystery
# '" comments below ( title after' entry).
# Only Ctrl+* keys are bound so no single-letter mpv defaults are clobbered.

# --- Opening files ---
Ctrl+o      script-binding open_dialog/open-file-dialog   #! Open file · native dialog
Ctrl+b      script-binding uosc/open-file       #! Open file · browser

# --- uosc menu (right-click / Menu key) ---
MBTN_RIGHT  script-binding uosc/menu
MENU        script-binding uosc/menu

# --- keyless menu-only entries (the "#" placeholder = no keybinding, menu item only) ---
#           script-binding uosc/playlist        #! Playlist
#           script-binding uosc/chapters        #! Chapters
#           script-binding uosc/audio           #! Tracks > Audio
#           script-binding uosc/subtitles       #! Tracks > Subtitles
#           script-binding uosc/keybinds        #! Keybinds

# --- yt workflow actions (wl-actions.lua; operate on the current video) ---
#           script-binding wl_actions/mark-watched   #! YouTube > Mark watched (delete)
#           script-binding wl_actions/promote-gold   #! YouTube > Promote to gold
#           script-binding wl_actions/comments       #! YouTube > Comments
#           script-binding wl_actions/open-browser   #! YouTube > Open in browser
