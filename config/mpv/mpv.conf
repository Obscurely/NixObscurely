# ~/.config/mpv/mpv.conf --- glacial mpv. uosc draws the whole UI (see script-opts/uosc.conf).

# --- uosc requirements: it replaces mpv's built-in OSC + window border ---
osc=no
border=no

# --- window / player behavior (VLC-like) ---
keep-open=yes                 # stay on the last frame at end-of-file instead of quitting
save-position-on-quit=yes     # resume where you left off (writes ~/.config/mpv/watch_later)
force-window=immediate        # show a window even for audio-only, so uosc is visible
cursor-autohide=1000

# --- OSD / fonts (match the desktop) ---
osd-font=Fira Code
osd-bar=no                    # uosc draws the seek bar

# --- video output (conservative on the GTX 1660 Ti: good scalers, NO interpolation) ---
vo=gpu-next
hwdec=auto-safe
profile=high-quality

# --- audio ---
volume=100
volume-max=130

# --- subtitles ---
sub-auto=fuzzy
slang=en,eng
sub-font=Fira Code

# --- YouTube / streaming (mpv auto-detects yt-dlp on PATH; only affects STREAMED urls) ---
# Prefer VP9 (NVDEC-decodable on Turing) over AV1 (no HW decode) while keeping max res/bitrate/HDR.
# Downloaded files are already selected by `yt get` (yt-dlp), so this is just for ad-hoc streaming.
ytdl-format="bestvideo[vcodec!*=av01]+bestaudio/best"
# generous cache for network streams
cache=yes
demuxer-max-bytes=400MiB
demuxer-readahead-secs=20
