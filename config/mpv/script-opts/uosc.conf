# ~/.config/mpv/script-opts/uosc.conf --- glacial theme for uosc.
# Colors map uosc's palette onto the glacial design language (RRGGBB, no leading #).
# See docs/glacial-design-language.md and the mpv spec.
#   foreground      = accent (timeline fill / active marks)         #8CC6F2
#   foreground_text = text drawn ON the accent (e.g. current time)  #0E1420 (dark navy)
#   background      = menus / elements canvas                       #141B22 (content)
#   background_text = text on the background                        #CBD8EA ($text)
#   curtain         = dim overlay behind menus                      #0E1420
#   success/error   = glacial semantic green / red                  #8FC7B4 / #E58A8A
#   match           = menu search highlight                         #8CC6F2 (accent)
#   heatmap         = timeline density heatmap                      #5E8DB8
color=foreground=8CC6F2,foreground_text=0E1420,background=141B22,background_text=CBD8EA,curtain=0E1420,success=8FC7B4,error=E58A8A,match=8CC6F2,heatmap=5E8DB8

# Tiling WM: sway manages windows, so drop uosc's CSD window buttons. Keep the title bar.
top_bar_controls=no

# Glacial rounding (matches the desktop's rounded surfaces).
border_radius=4
