# cava — feeds the glacial media-widget visualizer (see docs/.../media-visualizer-design.md).
# Raw mono spectrum on stdout; media-toggle redirects it into the eww-cava fifo while the
# popup is open. Values 0..ascii_max_range map straight to bar pixel height in the widget.

[general]
# eww re-renders the whole bar strip on GTK's single UI thread each frame; high rates
# (120/240) render unevenly and amplify any other stall. 30 renders smoothly and keeps
# the 1s seek-poll hitch down to ~1 frame.
framerate = 30
bars = 12
autosens = 1

[input]
# pulse backend + source=auto auto-targets the DEFAULT SINK's monitor (what you hear),
# and follows default-device changes. (pipewire+auto grabbed the default input = silence.)
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 24
channels = mono
mono_option = average
bar_delimiter = 59

[smoothing]
noise_reduction = 0.77
